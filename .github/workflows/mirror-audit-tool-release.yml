name: Mirror Audit-Tool Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag to mirror; leave empty for the latest release.
        required: false
        default: ""
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: write

concurrency:
  group: mirror-audit-tool-release
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror allowlisted release assets
        env:
          SOURCE_REPO: AuditToolkitLabs/Audit-Tool-
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          python3 - << 'PY'
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          from pathlib import Path
          from urllib.request import Request, urlopen

          source_repo = os.environ.get("SOURCE_REPO", "AuditToolkitLabs/Audit-Tool-")
          requested_tag = os.environ.get("RELEASE_TAG", "").strip()
          downloads_root = Path("downloads")

          def github_json(url: str):
              request = Request(url, headers={"Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              with urlopen(request) as response:
                  return json.loads(response.read().decode("utf-8"))

          def download(url: str, target: Path):
              target.parent.mkdir(parents=True, exist_ok=True)
              request = Request(url, headers={"Accept": "application/octet-stream", "X-GitHub-Api-Version": "2022-11-28"})
              with urlopen(request) as response:
                  target.write_bytes(response.read())

            def pick_release(releases):
              if requested_tag:
                  for release in releases:
                      if release.get("tag_name") == requested_tag:
                          return release
                  raise SystemExit(f"Requested release tag {requested_tag} was not found in {source_repo}.")
              if not releases:
                  raise SystemExit(f"No releases found in {source_repo}.")
              return releases[0]

            def allowlist_for(release_tag: str, release_version: str):
              escaped_version = re.escape(release_version)
              return [
                (re.compile(rf"^agent-{escaped_version}\.tar\.gz$"), downloads_root / "agent" / release_tag),
                (re.compile(rf"^audit-fleet-agent-{escaped_version}-(linux\.tar\.gz|windows\.zip)$"), downloads_root / "audit-fleet-agent" / release_tag),
                (re.compile(rf"^audit-hypervisor-agent-{escaped_version}-(esxi\.tar\.gz|linux\.tar\.gz)$"), downloads_root / "audit-hypervisor-agent" / release_tag),
                (re.compile(rf"^audit-standalone-agent-{escaped_version}-(linux\.tar\.gz|windows\.zip)$"), downloads_root / "audit-standalone-agent" / release_tag),
                (re.compile(rf"^audit-toolkit-{escaped_version}-1\.noarch\.rpm$"), downloads_root / "audit-toolkit" / release_tag),
                (re.compile(rf"^audit-toolkit-full-{escaped_version}-(linux\.tar\.gz|windows\.zip)$"), downloads_root / "audit-toolkit" / release_tag),
                (re.compile(rf"^audit-toolkit_{escaped_version}_all\.deb$"), downloads_root / "audit-toolkit" / release_tag),
                (re.compile(rf"^fleet-agent-(linux|windows)-{escaped_version}\.(tar\.gz|zip)$"), downloads_root / "audit-fleet-agent" / release_tag),
                (re.compile(rf"^lightweight-agent-(linux|windows)-{escaped_version}\.(tar\.gz|zip)$"), downloads_root / "lightweight-agent" / release_tag),
                (re.compile(rf"^scripts-{escaped_version}\.tar\.gz$"), downloads_root / "scripts" / release_tag),
                (re.compile(rf"^unified-jre-agent-{escaped_version}\.tar\.gz$"), downloads_root / "unified-jre-agent" / release_tag),
                (re.compile(rf"^web-{escaped_version}\.tar\.gz$"), downloads_root / "web" / release_tag),
                (re.compile(rf"^checksums-ci-{escaped_version}\.txt$"), downloads_root / "release" / release_tag),
                (re.compile(r"^manifest\.json$"), downloads_root / "release" / release_tag),
                (re.compile(r"^changelog\.md$"), downloads_root / "release" / release_tag),
              ]

          releases_url = f"https://api.github.com/repos/{source_repo}/releases?per_page=100"
          releases = github_json(releases_url)
          release = pick_release(releases)
          tag = release["tag_name"]
          release_tag = tag
          release_version = tag.lstrip("v")
          assets = release.get("assets", [])
          allowed = allowlist_for(release_tag, release_version)

          matched_assets = set()
          violations = []

          for asset in assets:
              name = asset.get("name", "")
              if re.search(r"(?:source|src|code)", name, re.IGNORECASE):
                  violations.append(f"Rejected suspicious asset name: {name}")
                  continue

              match = next(((pattern, target) for pattern, target in allowed if pattern.match(name)), None)
              if not match:
                  violations.append(f"No allowlist match for asset: {name}")
                  continue

              _, target_dir = match
              target_path = target_dir / name
              download(asset["url"], target_path)
              matched_assets.add(name)

          if violations:
              print("Mirror aborted because one or more assets were not allowlisted:")
              for violation in violations:
                  print(f"- {violation}")
              sys.exit(1)

          expected = {pattern.pattern for pattern, _ in allowed}
          print(f"Mirrored {len(matched_assets)} allowlisted assets from {source_repo}@{tag}.")
          print("Allowlist patterns:")
          for pattern in sorted(expected):
              print(f"- {pattern}")
          PY

      - name: Commit mirrored release assets
        run: |
          set -euo pipefail
          if git diff --quiet -- downloads; then
            echo "No mirrored asset changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads
          git commit -m "Mirror allowlisted Audit-Tool release assets"
          git push