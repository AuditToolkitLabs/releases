name: Publish Downloads Site

on:
  push:
    branches: [main]
    paths:
      - downloads/**
      - .github/workflows/publish-downloads-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static downloads index
        run: |
          set -euo pipefail

          mkdir -p site
          files_dir="downloads/files"

          {
            echo '<!doctype html>'
            echo '<html lang="en">'
            echo '<head>'
            echo '  <meta charset="utf-8">'
            echo '  <meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '  <title>AuditToolkit Labs Downloads</title>'
            echo '  <style>'
            echo '    body { font-family: "Segoe UI", sans-serif; margin: 2rem; color: #111827; background: #f3f4f6; }'
            echo '    main { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 1.5rem; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }'
            echo '    h1 { margin-top: 0; }'
            echo '    ul { line-height: 1.8; }'
            echo '    a { color: #0f4c81; text-decoration: none; }'
            echo '    a:hover { text-decoration: underline; }'
            echo '    .meta { color: #6b7280; font-size: 0.92rem; }'
            echo '  </style>'
            echo '</head>'
            echo '<body>'
            echo '  <main>'
            echo '    <h1>AuditToolkit Labs Downloads</h1>'
            echo '    <p class="meta">Published from repository artifacts in <code>downloads/files/</code>.</p>'
            echo '    <ul>'

            if [ -d "$files_dir" ] && find "$files_dir" -type f | read -r _; then
              find "$files_dir" -type f | sort | while IFS= read -r f; do
                rel="${f#downloads/}"
                name="${f#downloads/files/}"
                size="$(wc -c < "$f" | tr -d ' ')"
                echo "      <li><a href=\"$rel\">$name</a> <span class=\"meta\">($size bytes)</span></li>"
              done
            else
              echo '      <li>No files published yet.</li>'
            fi

            echo '    </ul>'
            echo '  </main>'
            echo '</body>'
            echo '</html>'
          } > site/index.html

          mkdir -p site/files
          if [ -d "$files_dir" ]; then
            cp -R "$files_dir"/. site/files/ 2>/dev/null || true
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
