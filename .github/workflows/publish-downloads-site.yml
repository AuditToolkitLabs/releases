name: Publish Downloads Site

on:
  push:
    branches: [main]
    paths:
      - downloads/**
      - .github/workflows/publish-downloads-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static downloads index
        run: |
          set -euo pipefail

          mkdir -p site

          python3 - << 'PY'
          from pathlib import Path
          import html
          import shutil

          source_root = Path("downloads")
          site_root = Path("site")
          downloads_root = site_root / "downloads"

          if downloads_root.exists():
            shutil.rmtree(downloads_root)
          if source_root.exists():
            shutil.copytree(source_root, downloads_root, ignore=shutil.ignore_patterns(".gitkeep"))

          def render_page(title: str, subtitle: str, items):
            lines = [
              '<!doctype html>',
              '<html lang="en">',
              '<head>',
              '  <meta charset="utf-8">',
              '  <meta name="viewport" content="width=device-width, initial-scale=1">',
              f'  <title>{html.escape(title)}</title>',
              '  <style>',
              '    body { font-family: "Segoe UI", sans-serif; margin: 2rem; color: #111827; background: #f3f4f6; }',
              '    main { max-width: 960px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 1.5rem 1.75rem; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }',
              '    h1 { margin-top: 0; }',
              '    ul { line-height: 1.8; padding-left: 1.25rem; }',
              '    a { color: #0f4c81; text-decoration: none; }',
              '    a:hover { text-decoration: underline; }',
              '    .meta { color: #6b7280; font-size: 0.92rem; }',
              '    .crumb { margin-bottom: 1rem; }',
              '  </style>',
              '</head>',
              '<body>',
              '  <main>',
              f'    <h1>{html.escape(title)}</h1>',
              f'    <p class="meta">{html.escape(subtitle)}</p>',
            ]

            if items:
              lines.append('    <ul>')
              for label, href, meta in items:
                meta_html = f' <span class="meta">({html.escape(meta)})</span>' if meta else ''
                lines.append(f'      <li><a href="{html.escape(href)}">{html.escape(label)}</a>{meta_html}</li>')
              lines.append('    </ul>')
            else:
              lines.append('    <p class="meta">No downloads available yet.</p>')

            lines.extend(['  </main>', '</body>', '</html>'])
            return '\n'.join(lines)

          def page_items(directory: Path, depth: int):
            entries = []
            for child in sorted(directory.iterdir(), key=lambda p: (p.is_file(), p.name.lower())):
              if child.name == 'index.html':
                continue
              if child.is_dir():
                entries.append((child.name, f"{child.name}/", 'folder'))
              else:
                size = child.stat().st_size
                entries.append((child.name, child.name, f'{size} bytes'))
            return entries

          site_root.mkdir(parents=True, exist_ok=True)
          (site_root / 'index.html').write_text(
            render_page(
              'AuditToolkit Labs Downloads',
              'Select a tool folder to browse its versioned release artifacts.',
              [('downloads/', 'downloads/', 'tool and version folders')] if downloads_root.exists() else []
            ),
            encoding='utf-8'
          )

          if downloads_root.exists():
            for directory in [downloads_root] + [p for p in downloads_root.rglob('*') if p.is_dir()]:
              items = page_items(directory, 0)
              rel_dir = directory.relative_to(site_root)
              directory.joinpath('index.html').write_text(
                render_page(
                  f'AuditToolkit Labs Downloads / {rel_dir.as_posix()}',
                  'Versioned release artifacts are grouped by tool and version.',
                  items
                ),
                encoding='utf-8'
              )

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
