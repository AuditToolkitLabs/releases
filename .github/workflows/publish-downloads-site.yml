name: Publish Downloads Site

on:
  push:
    branches: [main]
    paths:
      - downloads/**
      - .github/workflows/publish-downloads-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static downloads index
        run: |
          set -euo pipefail

          mkdir -p site

          python3 - << 'PY'
          from pathlib import Path
          import html
          import shutil

          source_root = Path("downloads")
          site_root = Path("site")
          downloads_root = site_root / "downloads"

          if downloads_root.exists():
              shutil.rmtree(downloads_root)
          if source_root.exists():
              shutil.copytree(source_root, downloads_root, ignore=shutil.ignore_patterns(".gitkeep"))

          def human_size(size: int) -> str:
              for unit in ["B", "KB", "MB", "GB"]:
                  if size < 1024 or unit == "GB":
                      return f"{size} {unit}" if unit == "B" else f"{size:.1f} {unit}"
                  size /= 1024

          def render_card_page(title: str, subtitle: str, cards, back_href: str | None = None):
              lines = [
                  '<!doctype html>',
                  '<html lang="en">',
                  '<head>',
                  '  <meta charset="utf-8">',
                  '  <meta name="viewport" content="width=device-width, initial-scale=1">',
                  f'  <title>{html.escape(title)}</title>',
                  '  <style>',
                  '    :root { color-scheme: light; }',
                  '    body { margin: 0; font-family: "Segoe UI", sans-serif; color: #0f172a; background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 28%, #f3f4f6 100%); }',
                  '    main { max-width: 1140px; margin: 0 auto; padding: 2rem 1rem 3rem; }',
                  '    .frame { background: rgba(255,255,255,0.88); border: 1px solid rgba(148,163,184,0.2); border-radius: 22px; overflow: hidden; box-shadow: 0 18px 50px rgba(15,23,42,0.08); }',
                  '    .hero { padding: 2rem 2rem 1.25rem; background: linear-gradient(135deg, #0f172a 0%, #1d4ed8 55%, #2563eb 100%); color: #fff; }',
                  '    .hero h1 { margin: 0 0 0.45rem; font-size: 2rem; }',
                  '    .hero p { margin: 0; max-width: 74ch; color: rgba(255,255,255,0.9); }',
                  '    .content { padding: 1.5rem 2rem 2rem; }',
                  '    .crumbs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0 0 1rem; font-size: 0.92rem; color: #64748b; }',
                  '    .crumbs a { color: #1d4ed8; text-decoration: none; }',
                  '    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }',
                  '    .card { display: flex; flex-direction: column; justify-content: space-between; min-height: 110px; border: 1px solid #e5e7eb; border-radius: 16px; padding: 1rem; background: #fff; box-shadow: 0 6px 20px rgba(15,23,42,0.04); }',
                  '    .card a { color: #0f4c81; text-decoration: none; font-weight: 700; }',
                  '    .card a:hover { text-decoration: underline; }',
                  '    .meta { margin-top: 0.4rem; color: #64748b; font-size: 0.92rem; }',
                  '    .badge { align-self: flex-start; margin-top: 0.8rem; font-size: 0.78rem; padding: 0.22rem 0.55rem; border-radius: 999px; background: #eef2ff; color: #3730a3; }',
                  '    .muted { color: #64748b; }',
                  '  </style>',
                  '</head>',
                  '<body>',
                  '  <main>',
                  '    <div class="frame">',
                  '      <section class="hero">',
                  f'        <h1>{html.escape(title)}</h1>',
                  f'        <p>{html.escape(subtitle)}</p>',
                  '      </section>',
                  '      <section class="content">',
              ]

              if back_href:
                  lines.append(f'        <div class="crumbs"><a href="{html.escape(back_href)}">Back</a></div>')

              if cards:
                  lines.append('        <div class="grid">')
                  for label, href, meta, badge in cards:
                      lines.append('          <div class="card">')
                      lines.append(f'            <div><a href="{html.escape(href)}">{html.escape(label)}</a></div>')
                      if meta:
                          lines.append(f'            <div class="meta">{html.escape(meta)}</div>')
                      if badge:
                          lines.append(f'            <div class="badge">{html.escape(badge)}</div>')
                      lines.append('          </div>')
                  lines.append('        </div>')
              else:
                  lines.append('        <p class="muted">No downloads available yet.</p>')

              lines.extend(['      </section>', '    </div>', '  </main>', '</body>', '</html>'])
              return '\n'.join(lines)

          def render_list_page(title: str, subtitle: str, items, back_href: str | None = None):
              lines = [
                  '<!doctype html>',
                  '<html lang="en">',
                  '<head>',
                  '  <meta charset="utf-8">',
                  '  <meta name="viewport" content="width=device-width, initial-scale=1">',
                  f'  <title>{html.escape(title)}</title>',
                  '  <style>',
                  '    :root { color-scheme: light; }',
                  '    body { margin: 0; font-family: "Segoe UI", sans-serif; color: #0f172a; background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 28%, #f3f4f6 100%); }',
                  '    main { max-width: 1140px; margin: 0 auto; padding: 2rem 1rem 3rem; }',
                  '    .frame { background: rgba(255,255,255,0.88); border: 1px solid rgba(148,163,184,0.2); border-radius: 22px; overflow: hidden; box-shadow: 0 18px 50px rgba(15,23,42,0.08); }',
                  '    .hero { padding: 2rem 2rem 1.25rem; background: linear-gradient(135deg, #0f172a 0%, #1d4ed8 55%, #2563eb 100%); color: #fff; }',
                  '    .hero h1 { margin: 0 0 0.45rem; font-size: 2rem; }',
                  '    .hero p { margin: 0; max-width: 74ch; color: rgba(255,255,255,0.9); }',
                  '    .content { padding: 1.5rem 2rem 2rem; }',
                  '    .crumbs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0 0 1rem; font-size: 0.92rem; color: #64748b; }',
                  '    .crumbs a { color: #1d4ed8; text-decoration: none; }',
                  '    .assets { list-style: none; padding: 0; margin: 0; border: 1px solid #e5e7eb; border-radius: 16px; overflow: hidden; background: #fff; }',
                  '    .asset { display: flex; align-items: flex-start; gap: 1rem; padding: 1rem 1.15rem; border-top: 1px solid #e5e7eb; }',
                  '    .asset:first-child { border-top: 0; }',
                  '    .asset .index { width: 2rem; text-align: right; color: #64748b; font-variant-numeric: tabular-nums; }',
                  '    .asset .body { flex: 1; min-width: 0; }',
                  '    .asset a { color: #0f4c81; text-decoration: none; font-weight: 700; word-break: break-word; }',
                  '    .asset a:hover { text-decoration: underline; }',
                  '    .asset .meta { margin-top: 0.25rem; color: #64748b; font-size: 0.92rem; }',
                  '    .asset .badge { align-self: center; font-size: 0.76rem; padding: 0.22rem 0.55rem; border-radius: 999px; background: #eef2ff; color: #3730a3; }',
                  '    .muted { color: #64748b; }',
                  '  </style>',
                  '</head>',
                  '<body>',
                  '  <main>',
                  '    <div class="frame">',
                  '      <section class="hero">',
                  f'        <h1>{html.escape(title)}</h1>',
                  f'        <p>{html.escape(subtitle)}</p>',
                  '      </section>',
                  '      <section class="content">',
              ]

              if back_href:
                  lines.append(f'        <div class="crumbs"><a href="{html.escape(back_href)}">Back</a></div>')

              if items:
                  lines.append('        <ul class="assets">')
                  for index, (label, href, meta, badge) in enumerate(items, start=1):
                      lines.append('          <li class="asset">')
                      lines.append(f'            <div class="index">{index}</div>')
                      lines.append('            <div class="body">')
                      lines.append(f'              <div><a href="{html.escape(href)}">{html.escape(label)}</a></div>')
                      if meta:
                          lines.append(f'              <div class="meta">{html.escape(meta)}</div>')
                      lines.append('            </div>')
                      if badge:
                          lines.append(f'            <div class="badge">{html.escape(badge)}</div>')
                      lines.append('          </li>')
                  lines.append('        </ul>')
              else:
                  lines.append('        <p class="muted">No downloads available yet.</p>')

              lines.extend(['      </section>', '    </div>', '  </main>', '</body>', '</html>'])
              return '\n'.join(lines)

          def list_children(directory: Path):
              folders = []
              files = []
              for child in sorted(directory.iterdir(), key=lambda p: (p.is_file(), p.name.lower())):
                  if child.name == 'index.html':
                      continue
                  if child.is_dir():
                      folders.append(child)
                  else:
                      files.append(child)
              return folders, files

          def write_indexes(directory: Path, site_directory: Path, title: str, subtitle: str, back_href: str | None):
              folders, files = list_children(directory)
              cards = []
              for folder in folders:
                  badge = 'Release tag' if directory == downloads_root or directory.parent == downloads_root else 'Folder'
                  meta = 'Release tag folder' if badge == 'Release tag' else 'Folder'
                  cards.append((folder.name, f"{folder.name}/", meta, badge))
              for file in files:
                  cards.append((file.name, file.name, human_size(file.stat().st_size), 'Download'))

              site_directory.mkdir(parents=True, exist_ok=True)
              page_writer = render_card_page
              if directory != downloads_root and directory.parent != downloads_root:
                  page_writer = render_list_page

              (site_directory / 'index.html').write_text(page_writer(title, subtitle, cards, back_href=back_href), encoding='utf-8')

              for folder in folders:
                  relative_parts = folder.relative_to(downloads_root).parts
                  if len(relative_parts) == 1:
                      child_title = f"Tool: {folder.name}"
                      child_subtitle = f"Release tags available for {folder.name}."
                  elif len(relative_parts) == 2:
                      child_title = f"Release tag: {folder.name}"
                      child_subtitle = f"{len(list_children(folder)[1])} files published for release tag {folder.name}."
                  else:
                      child_title = f"{title} / {folder.name}"
                      child_subtitle = 'Release-tag files are grouped under the tool name and version tag.'

                  write_indexes(
                      folder,
                      site_directory / folder.name,
                      child_title,
                      child_subtitle,
                      '../'
                  )

          site_root.mkdir(parents=True, exist_ok=True)

          top_cards = []
          if downloads_root.exists():
              for folder in sorted([p for p in downloads_root.iterdir() if p.is_dir()], key=lambda p: p.name.lower()):
                  top_cards.append((folder.name, f"downloads/{folder.name}/", 'Browse version folders and downloads', 'Tool'))

          (site_root / 'index.html').write_text(
              render_card_page(
                  'AuditToolkit Labs Downloads',
                  'Public binaries are grouped by tool and release version. Pick a tool below or browse the full downloads tree.',
                  top_cards,
              ),
              encoding='utf-8'
          )

          if downloads_root.exists():
              write_indexes(
                  downloads_root,
                  site_root / 'downloads',
                  'AuditToolkit Labs Downloads',
                  'Select a tool folder to browse its release tags and the files for each tag.',
                  '/'
              )
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
