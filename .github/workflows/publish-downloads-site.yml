name: Publish Downloads Site

on:
  push:
    branches: [main]
    paths:
      - downloads/**
      - .github/workflows/publish-downloads-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static downloads index
        run: |
          set -euo pipefail

          mkdir -p site

          python3 - << 'PY'
          from pathlib import Path
          import html, re

          source_root = Path("downloads")
          site_root = Path("site")

          STYLES = '''
            :root { color-scheme: light; }
            body { margin: 0; font-family: "Segoe UI", sans-serif; color: #0f172a; background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 28%, #f3f4f6 100%); }
            main { max-width: 1140px; margin: 0 auto; padding: 2rem 1rem 3rem; }
            .frame { background: rgba(255,255,255,0.88); border: 1px solid rgba(148,163,184,0.2); border-radius: 22px; overflow: hidden; box-shadow: 0 18px 50px rgba(15,23,42,0.08); }
            .hero { padding: 2rem 2rem 1.25rem; background: linear-gradient(135deg, #0f172a 0%, #1d4ed8 55%, #2563eb 100%); color: #fff; }
            .hero h1 { margin: 0 0 0.45rem; font-size: 2rem; }
            .hero p { margin: 0; max-width: 74ch; color: rgba(255,255,255,0.9); }
            .content { padding: 1.5rem 2rem 2rem; }
            .crumbs { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; margin: 0 0 1.25rem; font-size: 0.92rem; color: #64748b; }
            .crumbs a { color: #1d4ed8; text-decoration: none; }
            .crumbs a:hover { text-decoration: underline; }
            .crumbs .sep { color: #94a3b8; }
            .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
            .card { display: flex; flex-direction: column; justify-content: space-between; min-height: 110px; border: 1px solid #e5e7eb; border-radius: 16px; padding: 1rem; background: #fff; box-shadow: 0 6px 20px rgba(15,23,42,0.04); }
            .card a { color: #0f4c81; text-decoration: none; font-weight: 700; }
            .card a:hover { text-decoration: underline; }
            .meta { margin-top: 0.4rem; color: #64748b; font-size: 0.92rem; }
            .badge { align-self: flex-start; margin-top: 0.8rem; font-size: 0.78rem; padding: 0.22rem 0.55rem; border-radius: 999px; background: #eef2ff; color: #3730a3; }
            .muted { color: #64748b; }
            .assets { list-style: none; padding: 0; margin: 0; border: 1px solid #e5e7eb; border-radius: 16px; overflow: hidden; background: #fff; }
            .asset { display: flex; align-items: flex-start; gap: 1rem; padding: 1rem 1.15rem; border-top: 1px solid #e5e7eb; }
            .asset:first-child { border-top: 0; }
            .asset .index { width: 2rem; text-align: right; color: #64748b; font-variant-numeric: tabular-nums; }
            .asset .body { flex: 1; min-width: 0; }
            .asset a { color: #0f4c81; text-decoration: none; font-weight: 700; word-break: break-word; }
            .asset a:hover { text-decoration: underline; }
            .asset .meta { margin-top: 0.25rem; color: #64748b; font-size: 0.92rem; }
            .asset .dl-badge { align-self: center; font-size: 0.76rem; padding: 0.22rem 0.55rem; border-radius: 999px; background: #eef2ff; color: #3730a3; }
            .info-section { margin-top: 2rem; }
            .section-heading { font-size: 1.1rem; font-weight: 700; color: #0f172a; margin: 0 0 0.85rem; padding-bottom: 0.45rem; border-bottom: 2px solid #e5e7eb; }
            .changelog-body { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 1.25rem 1.5rem; font-size: 0.97rem; line-height: 1.7; }
            .changelog-body h2 { font-size: 1.05rem; color: #1d4ed8; margin: 1.2rem 0 0.3rem; }
            .changelog-body h3 { font-size: 0.97rem; color: #0f172a; margin: 0.9rem 0 0.2rem; }
            .changelog-body ul { margin: 0.25rem 0 0.75rem 1.25rem; padding: 0; }
            .changelog-body li { margin-bottom: 0.35rem; }
            .changelog-body code { background: #f1f5f9; border-radius: 4px; padding: 0.1em 0.35em; font-size: 0.88em; }
            .changelog-body strong { color: #0f172a; }
            .checksums { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 16px; padding: 1rem 1.25rem; font-size: 0.82rem; line-height: 1.6; overflow-x: auto; white-space: pre; word-break: keep-all; margin: 0; }
          '''

          def human_size(size: int) -> str:
              for unit in ["B", "KB", "MB", "GB"]:
                  if size < 1024 or unit == "GB":
                      return f"{size} {unit}" if unit == "B" else f"{size:.1f} {unit}"
                  size /= 1024

          def page_shell(title: str, hero_subtitle: str, crumbs: list, body_html: str) -> str:
              crumb_html = ''
              if crumbs:
                  parts = []
                  for label, href in crumbs[:-1]:
                      parts.append(f'<a href="{html.escape(href)}">{html.escape(label)}</a>')
                      parts.append('<span class="sep">/</span>')
                  parts.append(f'<span>{html.escape(crumbs[-1][0])}</span>')
                  crumb_html = f'<div class="crumbs">{"".join(parts)}</div>'
              return f'''<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>{html.escape(title)}</title>
            <style>{STYLES}</style>
          </head>
          <body>
            <main>
              <div class="frame">
                <section class="hero">
                  <h1>{html.escape(title)}</h1>
                  <p>{html.escape(hero_subtitle)}</p>
                </section>
                <section class="content">
                  {crumb_html}
                  {body_html}
                </section>
              </div>
            </main>
          </body>
          </html>'''

          def card_grid(cards):
              if not cards:
                  return '<p class="muted">No downloads available yet.</p>'
              items = []
              for label, href, meta, badge in cards:
                  m = f'<div class="meta">{html.escape(meta)}</div>' if meta else ''
                  b = f'<div class="badge">{html.escape(badge)}</div>' if badge else ''
                  items.append(f'<div class="card"><div><a href="{html.escape(href)}">{html.escape(label)}</a></div>{m}{b}</div>')
              return f'<div class="grid">{"".join(items)}</div>'

          def asset_list(assets):
              if not assets:
                  return '<p class="muted">No files available yet.</p>'
              rows = []
              for i, (label, href, meta, badge) in enumerate(assets, start=1):
                  m = f'<div class="meta">{html.escape(meta)}</div>' if meta else ''
                  b = f'<div class="dl-badge">{html.escape(badge)}</div>' if badge else ''
                  rows.append(
                      f'<li class="asset">'
                      f'<div class="index">{i}</div>'
                      f'<div class="body"><div><a href="{html.escape(href)}">{html.escape(label)}</a></div>{m}</div>'
                      f'{b}</li>'
                  )
              return f'<ul class="assets">{"".join(rows)}</ul>'
          def render_md(text: str) -> str:
              """Minimal Markdown -> HTML (headings, bold, inline-code, lists, paragraphs)."""
              text = re.sub(r'<!--.*?-->', '', text, flags=re.DOTALL)
              def inline(s):
                  s = html.escape(s)
                  s = re.sub(r'\*\*(.+?)\*\*', r'<strong>\1</strong>', s)
                  s = re.sub(r'`(.+?)`', r'<code>\1</code>', s)
                  return s
              out, in_list = [], False
              for raw in text.split('\n'):
                  line = raw.rstrip()
                  if re.match(r'^## ', line):
                      if in_list: out.append('</ul>'); in_list = False
                      out.append(f'<h2>{inline(line[3:])}</h2>')
                  elif re.match(r'^### ', line):
                      if in_list: out.append('</ul>'); in_list = False
                      out.append(f'<h3>{inline(line[4:])}</h3>')
                  elif re.match(r'^# ', line):
                      if in_list: out.append('</ul>'); in_list = False
                      out.append(f'<h2>{inline(line[2:])}</h2>')
                  elif re.match(r'^- ', line):
                      if not in_list: out.append('<ul>'); in_list = True
                      out.append(f'<li>{inline(line[2:])}</li>')
                  elif line == '':
                      if in_list: out.append('</ul>'); in_list = False
                  else:
                      if in_list: out.append('</ul>'); in_list = False
                      out.append(f'<p>{inline(line)}</p>')
              if in_list: out.append('</ul>')
              return '\n'.join(out)
          site_root.mkdir(parents=True, exist_ok=True)

          if not source_root.exists():
              (site_root / 'index.html').write_text(
                  page_shell('AuditToolkit Labs Downloads', 'No downloads available yet.', [], '<p class="muted">No downloads available yet.</p>'),
                  encoding='utf-8'
              )
          else:
              tool_dirs = sorted([p for p in source_root.iterdir() if p.is_dir()], key=lambda p: p.name.lower())

              # Home page — one card per tool
              home_cards = []
              for tool_dir in tool_dirs:
                  version_dirs = sorted([p for p in tool_dir.iterdir() if p.is_dir() and p.name.startswith('v')], reverse=True)
                  file_count = sum(len([f for f in vd.iterdir() if f.is_file()]) for vd in version_dirs)
                  home_cards.append((
                      tool_dir.name,
                      f'{tool_dir.name}/',
                      f'{len(version_dirs)} version{"s" if len(version_dirs) != 1 else ""} • {file_count} files',
                      'Tool'
                  ))

              (site_root / 'index.html').write_text(
                  page_shell(
                      'AuditToolkit Labs Downloads',
                      'Select a tool to browse available versions and download artifacts.',
                      [],
                      card_grid(home_cards)
                  ),
                  encoding='utf-8'
              )

              for tool_dir in tool_dirs:
                  version_dirs = sorted([p for p in tool_dir.iterdir() if p.is_dir() and p.name.startswith('v')], reverse=True)
                  tool_site_dir = site_root / tool_dir.name
                  tool_site_dir.mkdir(parents=True, exist_ok=True)

                  # Tool page — one card per version
                  version_cards = []
                  for vd in version_dirs:
                      files = [f for f in vd.iterdir() if f.is_file()]
                      version_cards.append((
                          vd.name,
                          f'{vd.name}/',
                          f'{len(files)} file{"s" if len(files) != 1 else ""}',
                          'Release'
                      ))

                  (tool_site_dir / 'index.html').write_text(
                      page_shell(
                          tool_dir.name,
                          f'Available versions for {tool_dir.name}.',
                          [('Home', '../'), (tool_dir.name, '')],
                          card_grid(version_cards)
                      ),
                      encoding='utf-8'
                  )

                  for vd in version_dirs:
                      version_site_dir = tool_site_dir / vd.name
                      version_site_dir.mkdir(parents=True, exist_ok=True)

                      # Version page — asset list + inline docs + inline checksums
                      import json as _json
                      def find_doc_file(dir_path, names):
                          wanted = {n.lower() for n in names}
                          for f in dir_path.iterdir():
                              if f.is_file() and f.name.lower() in wanted:
                                  return f
                          return None

                      changelog_file = find_doc_file(vd, ['changelog.md'])
                      readme_file = find_doc_file(vd, ['readme.md'])
                      excluded_names = {'external-links.json'}
                      if changelog_file:
                          excluded_names.add(changelog_file.name)
                      if readme_file:
                          excluded_names.add(readme_file.name)

                      files = sorted(
                          [f for f in vd.iterdir() if f.is_file()
                           and f.name not in excluded_names
                           and not (f.name.startswith('checksums') and f.suffix == '.txt')],
                          key=lambda f: f.name.lower()
                      )
                      ext_entries = []
                      ext_by_name = {}
                      ext_file = vd / 'external-links.json'
                      if ext_file.exists():
                          ext_entries = _json.loads(ext_file.read_text(encoding='utf-8'))
                          ext_by_name = {entry.get('name'): entry for entry in ext_entries if entry.get('name')}

                      dl_assets = []
                      for f in files:
                          if f.name in ext_by_name:
                              entry = ext_by_name.pop(f.name)
                              size_str = entry.get('size', '') or human_size(f.stat().st_size)
                              badge = entry.get('badge', 'External')
                              dl_assets.append((f.name, entry['url'], size_str, badge))
                          else:
                              dl_href = f'../../downloads/{tool_dir.name}/{vd.name}/{f.name}'
                              dl_assets.append((f.name, dl_href, human_size(f.stat().st_size), 'Download'))

                      for entry in ext_entries:
                          name = entry.get('name')
                          if not name or name in {f.name for f in files}:
                              continue
                          size_str = entry.get('size', '')
                          badge = entry.get('badge', 'External')
                          dl_assets.append((name, entry['url'], size_str, badge))

                      body_parts = [asset_list(dl_assets)]

                      if changelog_file:
                          md_html = render_md(changelog_file.read_text(encoding='utf-8'))
                          body_parts.append(
                              f'<section class="info-section">'
                              f'<h2 class="section-heading">Release Notes</h2>'
                              f'<div class="changelog-body">{md_html}</div>'
                              f'</section>'
                          )

                      if readme_file:
                          md_html = render_md(readme_file.read_text(encoding='utf-8'))
                          body_parts.append(
                              f'<section class="info-section">'
                              f'<h2 class="section-heading">README</h2>'
                              f'<div class="changelog-body">{md_html}</div>'
                              f'</section>'
                          )

                      cs_files = sorted([f for f in vd.iterdir() if f.is_file()
                                         and f.name.startswith('checksums') and f.suffix == '.txt'])
                      if cs_files:
                          cs_text = html.escape(cs_files[0].read_text(encoding='utf-8'))
                          body_parts.append(
                              f'<section class="info-section">'
                              f'<h2 class="section-heading">File Checksums</h2>'
                              f'<pre class="checksums">{cs_text}</pre>'
                              f'</section>'
                          )

                      (version_site_dir / 'index.html').write_text(
                          page_shell(
                              f'{tool_dir.name} {vd.name}',
                              f'{len(dl_assets)} artifact{"s" if len(dl_assets) != 1 else ""} available for download.',
                              [('Home', '../../'), (tool_dir.name, '../'), (vd.name, '')],
                              '\n'.join(body_parts)
                          ),
                          encoding='utf-8'
                      )
          PY

      - name: Copy downloads into site
        run: cp -r downloads site/downloads

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
