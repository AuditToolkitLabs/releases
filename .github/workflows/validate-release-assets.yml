name: Validate Release Assets

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  require-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release has at least one asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The `release: published` payload is captured before the publisher has
          # finished uploading assets (sync-releases.py does `gh release create`
          # then `gh release upload`), so it is always empty here. Poll the API
          # for the settled asset list instead.
          # Large assets take minutes to finish uploading, so wait for a
          # non-empty list in which every asset has settled to "uploaded".
          for attempt in $(seq 1 30); do
            settled="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[] | select(.state == "uploaded")] | length')"
            total="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets | length')"
            if [ "$total" -gt 0 ] && [ "$settled" -eq "$total" ]; then
              echo "Release '$TAG' includes $total uploaded asset(s)."
              exit 0
            fi
            echo "Attempt $attempt: $settled/$total assets uploaded; waiting…"
            sleep 30
          done
          echo "Release '$TAG' has no settled assets after waiting 15 minutes."
          echo "Upload at least one binary/checksum asset before publishing."
          exit 1

      - name: Block source-like release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `gh` exposes the API endpoint as `apiUrl` and the browser link as
          # `url`; the inspection script below downloads via the API, so remap.
          RELEASE_JSON="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '{assets: [.assets[] | . + {url: .apiUrl}]}')"
          export RELEASE_JSON

          python3 - << 'PY'
          import json
          import os
          import pathlib
          import re
          import shutil
          import sys
          import tarfile
          import zipfile
          from urllib.request import Request, urlopen

          token = os.environ.get("GITHUB_TOKEN")
          release_raw = os.environ.get("RELEASE_JSON", "")
          if not release_raw:
              print("No release payload was provided to validation step.")
              sys.exit(1)

          release = json.loads(release_raw)
          assets = release.get("assets", [])

          source_exts = {
              ".c", ".cc", ".cpp", ".cxx", ".h", ".hpp", ".hh", ".hxx",
              ".cs", ".vb", ".fs", ".java", ".kt", ".kts", ".scala", ".groovy",
              ".js", ".jsx", ".ts", ".tsx", ".mjs", ".cjs", ".py", ".rb", ".php",
              ".go", ".rs", ".swift", ".m", ".mm", ".dart", ".r", ".jl", ".lua",
              ".sh", ".bash", ".zsh", ".ps1", ".psm1", ".psd1", ".cmd", ".bat",
              ".sql", ".yaml", ".yml", ".json", ".toml", ".ini", ".cfg", ".conf",
              ".xml", ".xaml", ".gradle", ".sln", ".vcxproj", ".csproj", ".fsproj",
              ".vbproj",
          }

          source_name_patterns = [
              re.compile(r"(^|[-_.])source([-_.]|$)", re.IGNORECASE),
              re.compile(r"(^|[-_.])src([-_.]|$)", re.IGNORECASE),
              re.compile(r"(^|[-_.])code([-_.]|$)", re.IGNORECASE),
          ]

          source_path_markers = {
              "/src/", "\\src\\", "/source/", "\\source\\", "/app/", "\\app\\"
          }

          archive_exts = {
              ".zip", ".tar", ".tgz", ".tar.gz", ".tbz2", ".tar.bz2", ".txz", ".tar.xz"
          }

          def is_likely_source_name(name: str) -> bool:
              lower = name.lower()
              if any(p.search(lower) for p in source_name_patterns):
                  return True
              suffixes = pathlib.Path(lower).suffixes
              if suffixes and suffixes[-1] in source_exts:
                  return True
              return False

          def has_source_content(entry: str) -> bool:
              p = entry.lower()
              if any(marker in p for marker in source_path_markers):
                  return True
              suffixes = pathlib.Path(p).suffixes
              if suffixes and suffixes[-1] in source_exts:
                  return True
              return False

          def download_asset(asset, target_path: pathlib.Path) -> bool:
              url = asset.get("url")
              if not url:
                  return False

              headers = {
                  "Accept": "application/octet-stream",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              req = Request(url, headers=headers)
              with urlopen(req) as resp:
                  target_path.write_bytes(resp.read())
              return True

          violations = []
          runner_temp = pathlib.Path(os.environ.get("RUNNER_TEMP", "/tmp"))
          download_dir = runner_temp / "release_assets"
          if download_dir.exists():
              shutil.rmtree(download_dir)
          download_dir.mkdir(parents=True, exist_ok=True)

          for asset in assets:
              name = asset.get("name", "")
              if is_likely_source_name(name):
                  violations.append(f"Asset name appears source-like: {name}")

              lower_name = name.lower()
              suffixes = pathlib.Path(lower_name).suffixes
              is_archive = lower_name.endswith((".tar.gz", ".tar.bz2", ".tar.xz")) or (
                  bool(suffixes) and suffixes[-1] in archive_exts
              )

              if not is_archive:
                  continue

              out_file = download_dir / name
              out_file.parent.mkdir(parents=True, exist_ok=True)

              try:
                  if not download_asset(asset, out_file):
                      violations.append(f"Could not download archive asset for inspection: {name}")
                      continue
              except Exception as ex:
                  violations.append(f"Failed to download archive {name}: {ex}")
                  continue

              try:
                  if lower_name.endswith(".zip"):
                      with zipfile.ZipFile(out_file, "r") as zf:
                          for entry in zf.namelist():
                              if has_source_content(entry):
                                  violations.append(f"Archive {name} contains source-like path: {entry}")
                                  break
                  else:
                      with tarfile.open(out_file, "r:*") as tf:
                          for member in tf.getmembers():
                              if has_source_content(member.name):
                                  violations.append(
                                      f"Archive {name} contains source-like path: {member.name}"
                                  )
                                  break
              except Exception as ex:
                  violations.append(f"Failed to inspect archive {name}: {ex}")

          if violations:
              print("Release blocked because source-like content was detected:")
              for violation in violations:
                  print(f"- {violation}")
              sys.exit(1)

          print("No source-like release assets detected.")
          PY
